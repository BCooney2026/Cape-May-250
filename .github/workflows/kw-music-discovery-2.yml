name: KW music discovery 2 (one-time)
on:
  push:
    branches: [kw-music-discovery-2]
    paths: ['tools/kw-music/discover2.mjs']
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tools/kw-music/discover2.mjs
      - run: |
          git config user.name "kw-music-bot"
          git config user.email "kw-music-bot@users.noreply.github.com"
          git add tools/kw-music/discovery4
          git commit -m "KW music discovery 2 snapshot" || exit 0
          git push
