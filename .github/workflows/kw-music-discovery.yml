name: KW music discovery (one-time)
on:
  push:
    branches: [kw-music-discovery]
    paths: ['tools/kw-music/discover.mjs', '.github/workflows/kw-music-discovery.yml']
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tools/kw-music/discover.mjs
      - name: Commit raw pages back to this branch
        run: |
          git config user.name "kw-music-bot"
          git config user.email "kw-music-bot@users.noreply.github.com"
          git add tools/kw-music/discovery
          git commit -m "KW music discovery snapshot" || echo "nothing to commit"
          git push
