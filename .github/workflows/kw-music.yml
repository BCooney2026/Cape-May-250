name: Key West live music (every 4 hours)

# Refreshes data/kw-music.json, which key_west.html reads for "Who's Playing in Key West".
# Runs all year. Each run commits a fresh timestamp, which also keeps GitHub from
# auto-disabling this schedule after 60 days without repo activity.
on:
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours at :17 past (UTC); avoids GitHub's top-of-hour backlog
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab
  push:
    paths:
      - 'tools/kw-music/update.mjs'
      - '.github/workflows/kw-music.yml'

permissions:
  contents: write

concurrency:
  group: kw-music
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch lineups
        run: node tools/kw-music/update.mjs
      - name: Commit updated lineups
        run: |
          git config user.name "kw-music-bot"
          git config user.email "kw-music-bot@users.noreply.github.com"
          git add data/kw-music.json
          git commit -m "Update Key West lineups" || { echo "No changes"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
